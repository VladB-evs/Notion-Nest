<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Christmas Countdown</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #191919;
    overflow: hidden;
  }

  body.theme-light {
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.65em;
    width: 100%;
    height: 100%;
    max-height: 3.1em;
    padding: 0.5em 0.95em;
    border-radius: 0.7em;
    background: #212121;
    border: 1px solid #2f2f2f;
    color: #ffffff;
    font-size: clamp(13px, min(30vh, 3.4vw + 7px), 24px);
    font-weight: 500;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }

  body.theme-light .pill {
    background: #fafafa;
    border-color: #e9e9e7;
    color: #191919;
  }

  .emoji {
    font-size: 1.15em;
    line-height: 1;
  }

  .label {
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .bar {
    flex: 1;
    min-width: 2.5em;
    height: 0.5em;
    border-radius: 999px;
    background: #383838;
    position: relative;
    overflow: hidden;
  }

  body.theme-light .bar {
    background: #ececea;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #d92c22, #ff3b30);
    box-shadow: 0 0 10px rgba(255, 59, 48, 0.55);
    transition: width 0.6s ease;
  }

  .pct {
    font-weight: 700;
    color: #ff3b30;
    font-variant-numeric: tabular-nums;
  }

  .days {
    color: #8a8a8a;
    font-size: 0.82em;
    font-weight: 500;
  }

  @media (max-width: 430px) {
    .days { display: none; }
  }

  @media (max-width: 280px) {
    .bar { display: none; }
  }

  @media (max-width: 210px) {
    .label { display: none; }
  }

  @media (max-height: 44px) {
    body { padding: 3px; }
    .pill { padding-top: 0.2em; padding-bottom: 0.2em; }
  }
</style>
</head>
<body>
  <div class="pill">
    <span class="emoji" id="emoji">🎄</span>
    <span class="label">Christmas</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
    <span class="days" id="days"></span>
    <span class="pct" id="pct">0%</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const fillEl = document.getElementById("fill");
    const pctEl = document.getElementById("pct");
    const daysEl = document.getElementById("days");
    const emojiParam = params.get("emoji");
    const themeParam = params.get("theme");

    if (emojiParam) emojiEl.textContent = emojiParam;
    if (themeParam === "light") document.body.classList.add("theme-light");

    function render() {
      const now = new Date();
      const year = now.getFullYear();
      const christmasThisYear = new Date(year, 11, 25);
      let prevChristmas, nextChristmas;
      if (now < christmasThisYear) {
        nextChristmas = christmasThisYear;
        prevChristmas = new Date(year - 1, 11, 25);
      } else {
        prevChristmas = christmasThisYear;
        nextChristmas = new Date(year + 1, 11, 25);
      }
      const percent = ((now - prevChristmas) / (nextChristmas - prevChristmas)) * 100;
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const daysLeft = Math.ceil((nextChristmas - startOfToday) / 86400000);
      fillEl.style.width = percent + "%";
      pctEl.textContent = percent.toFixed(1) + "%";
      daysEl.textContent = daysLeft === 0 ? "it's today!" : daysLeft + "d left";
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
