<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Christmas Countdown</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #191919;
    overflow: hidden;
  }

  body.theme-light {
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .line {
    display: flex;
    align-items: baseline;
    gap: clamp(5px, 1.4vw, 8px);
    white-space: nowrap;
    padding: 0 4vw;
    color: #ffffff;
    font-size: clamp(11px, 2.6vw, 15px);
    font-weight: 500;
  }

  body.theme-light .line {
    color: #191919;
  }

  .emoji {
    font-size: 1.2em;
  }

  .value {
    font-weight: 700;
    color: #ff3b30;
  }
</style>
</head>
<body>
  <div class="line" id="line">
    <span class="emoji" id="emoji">🎄</span>
    <span id="text"></span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const textEl = document.getElementById("text");
    const emojiParam = params.get("emoji");
    const themeParam = params.get("theme");

    if (emojiParam) emojiEl.textContent = emojiParam;
    if (themeParam === "light") document.body.classList.add("theme-light");

    function render() {
      const now = new Date();
      const year = now.getFullYear();
      const christmasThisYear = new Date(year, 11, 25);
      let prevChristmas, nextChristmas;
      if (now < christmasThisYear) {
        nextChristmas = christmasThisYear;
        prevChristmas = new Date(year - 1, 11, 25);
      } else {
        prevChristmas = christmasThisYear;
        nextChristmas = new Date(year + 1, 11, 25);
      }
      const percent = ((now - prevChristmas) / (nextChristmas - prevChristmas)) * 100;
      textEl.innerHTML = `You're <span class="value">${percent.toFixed(1)}%</span> of the way to Christmas`;
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
