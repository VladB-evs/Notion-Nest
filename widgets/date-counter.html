<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Date Counter</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #191919;
    overflow: hidden;
  }

  body.theme-light {
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.65em;
    width: 100%;
    height: 100%;
    max-height: 3.1em;
    padding: 0.5em 0.95em;
    border-radius: 0.7em;
    background: #212121;
    border: 1px solid #2f2f2f;
    color: #ffffff;
    font-size: clamp(13px, min(30vh, 3.4vw + 7px), 24px);
    font-weight: 500;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }

  body.theme-light .pill {
    background: #fafafa;
    border-color: #e9e9e7;
    color: #191919;
  }

  .emoji {
    font-size: 1.15em;
    line-height: 1;
  }

  .label {
    font-weight: 600;
    letter-spacing: 0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .spacer {
    flex: 1;
    min-width: 0.5em;
  }

  .readout {
    flex: 0 0 auto;
    font-weight: 500;
  }

  .readout .num {
    font-weight: 700;
    color: #ff3b30;
    font-variant-numeric: tabular-nums;
  }

  .readout .rel {
    color: #8a8a8a;
  }

  @media (max-width: 200px) {
    .readout .rel { display: none; }
  }

  @media (max-width: 150px) {
    .label { display: none; }
  }

  @media (max-height: 44px) {
    body { padding: 3px; }
    .pill { padding-top: 0.2em; padding-bottom: 0.2em; }
  }
</style>
</head>
<body>
  <div class="pill">
    <span class="emoji" id="emoji">📅</span>
    <span class="label" id="label">Event</span>
    <span class="spacer"></span>
    <span class="readout" id="readout">Set ?date=</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const labelEl = document.getElementById("label");
    const readoutEl = document.getElementById("readout");

    const emoji = params.get("emoji");
    const label = params.get("label");
    const dateParam = params.get("date");
    const theme = params.get("theme");

    if (emoji) emojiEl.textContent = emoji;
    else emojiEl.style.display = "none";
    if (label) labelEl.textContent = label;
    else labelEl.style.display = "none";
    if (theme === "light") document.body.classList.add("theme-light");

    function render() {
      if (!dateParam) return;
      const target = new Date(dateParam + "T00:00:00");
      if (isNaN(target.getTime())) {
        readoutEl.textContent = "Invalid date";
        return;
      }
      const now = new Date();
      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startTarget = new Date(target.getFullYear(), target.getMonth(), target.getDate());
      const diffDays = Math.round((startTarget - startToday) / 86400000);

      if (diffDays === 0) {
        readoutEl.innerHTML = `<span class="num">Today!</span>`;
        return;
      }
      const n = Math.abs(diffDays);
      const dayWord = n === 1 ? "day" : "days";
      const rel = diffDays > 0 ? "until" : "since";
      readoutEl.innerHTML = `<span class="num">${n} ${dayWord}</span> <span class="rel">${rel}</span>`;
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
