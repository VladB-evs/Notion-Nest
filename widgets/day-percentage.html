<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day Percentage</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .line {
    display: flex;
    align-items: baseline;
    gap: clamp(6px, 1.6vw, 12px);
    white-space: nowrap;
    color: #ffffff;
    font-size: clamp(11px, 3.4vw, 20px);
    font-weight: 500;
    padding: 0 4vw;
  }

  .emoji {
    font-size: 1.2em;
  }

  .value {
    font-weight: 700;
    color: #ff3b30;
  }
</style>
</head>
<body>
  <div class="line" id="line">
    <span class="emoji" id="emoji">⏳</span>
    <span id="text"></span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const textEl = document.getElementById("text");
    const emojiParam = params.get("emoji");

    if (emojiParam) emojiEl.textContent = emojiParam;

    function render() {
      const now = new Date();
      const secondsIntoDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const percent = (secondsIntoDay / 86400) * 100;
      textEl.innerHTML = `You're <span class="value">${percent.toFixed(1)}%</span> through today`;
    }

    render();
    setInterval(render, 1000);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
