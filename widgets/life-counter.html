<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Life Counter</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .line {
    display: flex;
    align-items: baseline;
    gap: clamp(5px, 1.4vw, 8px);
    white-space: nowrap;
    color: #ffffff;
    font-size: clamp(11px, 2.6vw, 15px);
    font-weight: 500;
    padding: 0 3vw;
  }

  body.theme-light .line {
    color: #191919;
  }

  .emoji {
    font-size: 1.2em;
  }

  .value {
    font-weight: 700;
    color: #ff3b30;
  }
</style>
</head>
<body>
  <div class="line" id="line">
    <span class="emoji" id="emoji">🧑</span>
    <span id="text">Set your birthday in the embed link</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const textEl = document.getElementById("text");
    const birthdayParam = params.get("birthday");
    const emojiParam = params.get("emoji");
    const themeParam = params.get("theme");

    if (emojiParam) emojiEl.textContent = emojiParam;
    if (themeParam === "light") document.body.classList.add("theme-light");

    function diffYMD(from, to) {
      let years = to.getFullYear() - from.getFullYear();
      let months = to.getMonth() - from.getMonth();
      let days = to.getDate() - from.getDate();
      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(to.getFullYear(), to.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return { years, months, days };
    }

    function render() {
      if (!birthdayParam) return;
      const birthday = new Date(birthdayParam + "T00:00:00");
      if (isNaN(birthday.getTime())) {
        textEl.textContent = "Invalid birthday in embed link";
        return;
      }
      const now = new Date();
      const { years, months, days } = diffYMD(birthday, now);
      const parts = [];
      if (years > 0) parts.push(`${years} year${years !== 1 ? "s" : ""}`);
      if (months > 0) parts.push(`${months} month${months !== 1 ? "s" : ""}`);
      parts.push(`${days} day${days !== 1 ? "s" : ""}`);

      textEl.innerHTML = `You've been around for <span class="value">${parts.join(", ")}</span>`;
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
