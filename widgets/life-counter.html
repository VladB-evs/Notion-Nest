<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Life Counter</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #191919;
    overflow: hidden;
  }

  body.theme-light {
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.65em;
    width: 100%;
    height: 100%;
    max-height: 3.1em;
    padding: 0.5em 0.95em;
    border-radius: 999px;
    background: #212121;
    border: 1px solid #2f2f2f;
    color: #ffffff;
    font-size: clamp(13px, min(30vh, 3.4vw + 7px), 24px);
    font-weight: 500;
    white-space: nowrap;
  }

  body.theme-light .pill {
    background: #fafafa;
    border-color: #e9e9e7;
    color: #191919;
  }

  .emoji {
    font-size: 1.15em;
    line-height: 1;
  }

  .age {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .age .unit {
    font-weight: 500;
    color: #8a8a8a;
    margin-right: 0.35em;
  }

  .age .unit:last-child {
    margin-right: 0;
  }

  .bar {
    flex: 1;
    min-width: 2.5em;
    height: 0.5em;
    border-radius: 999px;
    background: #383838;
    position: relative;
    overflow: hidden;
  }

  body.theme-light .bar {
    background: #ececea;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #d92c22, #ff3b30);
    box-shadow: 0 0 10px rgba(255, 59, 48, 0.55);
    transition: width 0.6s ease;
  }

  .next {
    color: #8a8a8a;
    font-size: 0.82em;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="pill">
    <span class="emoji" id="emoji">🐣</span>
    <span class="age" id="age">Set your birthday in the embed link</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
    <span class="next" id="next"></span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emojiEl = document.getElementById("emoji");
    const ageEl = document.getElementById("age");
    const fillEl = document.getElementById("fill");
    const nextEl = document.getElementById("next");
    const birthdayParam = params.get("birthday");
    const emojiParam = params.get("emoji");
    const themeParam = params.get("theme");

    if (emojiParam) emojiEl.textContent = emojiParam;
    if (themeParam === "light") document.body.classList.add("theme-light");

    function diffYMD(from, to) {
      let years = to.getFullYear() - from.getFullYear();
      let months = to.getMonth() - from.getMonth();
      let days = to.getDate() - from.getDate();
      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(to.getFullYear(), to.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return { years, months, days };
    }

    function render() {
      if (!birthdayParam) return;
      const birthday = new Date(birthdayParam + "T00:00:00");
      if (isNaN(birthday.getTime())) {
        ageEl.textContent = "Invalid birthday in embed link";
        return;
      }
      const now = new Date();
      const { years, months, days } = diffYMD(birthday, now);
      ageEl.innerHTML =
        `${years}<span class="unit">y</span>` +
        `${months}<span class="unit">m</span>` +
        `${days}<span class="unit">d</span>`;

      // Progress bar: how far through the current year of life,
      // i.e. progress from the last birthday toward the next one.
      const lastBirthday = new Date(birthday.getFullYear() + years, birthday.getMonth(), birthday.getDate());
      const nextBirthday = new Date(birthday.getFullYear() + years + 1, birthday.getMonth(), birthday.getDate());
      const percent = ((now - lastBirthday) / (nextBirthday - lastBirthday)) * 100;
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const daysToNext = Math.ceil((nextBirthday - startOfToday) / 86400000);
      fillEl.style.width = percent + "%";
      nextEl.textContent = daysToNext >= 365 ? "🎂 today!" : "🎂 " + daysToNext + "d";
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
