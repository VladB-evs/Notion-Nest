<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Season Progress</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #191919;
    overflow: hidden;
  }

  body.theme-light {
    background: #ffffff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.65em;
    width: 100%;
    height: 100%;
    max-height: 3.1em;
    padding: 0.5em 0.95em;
    border-radius: 0.7em;
    background: #212121;
    border: 1px solid #2f2f2f;
    color: #ffffff;
    font-size: clamp(13px, min(30vh, 3.4vw + 7px), 24px);
    font-weight: 500;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }

  body.theme-light .pill {
    background: #fafafa;
    border-color: #e9e9e7;
    color: #191919;
  }

  .emoji {
    font-size: 1.15em;
    line-height: 1;
  }

  .label {
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .bar {
    flex: 1;
    min-width: 2.5em;
    height: 0.5em;
    border-radius: 999px;
    background: #383838;
    position: relative;
    overflow: hidden;
  }

  body.theme-light .bar {
    background: #ececea;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--a), var(--b));
    box-shadow: 0 0 10px var(--glow);
    transition: width 0.6s ease;
  }

  .days {
    color: #8a8a8a;
    font-size: 0.82em;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .pct {
    font-weight: 700;
    color: var(--b);
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 430px) {
    .days { display: none; }
  }

  @media (max-width: 280px) {
    .bar { display: none; }
  }

  @media (max-width: 210px) {
    .label { display: none; }
  }

  @media (max-height: 44px) {
    body { padding: 3px; }
    .pill { padding-top: 0.2em; padding-bottom: 0.2em; }
  }
</style>
</head>
<body>
  <div class="pill">
    <span class="emoji" id="emoji">☀️</span>
    <span class="label" id="name">Season</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
    <span class="days" id="days"></span>
    <span class="pct" id="pct">0%</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const south = (params.get("hemisphere") || "").toLowerCase().startsWith("s");
    const themeParam = params.get("theme");

    if (themeParam === "light") document.body.classList.add("theme-light");

    function startsForYear(y) {
      return [
        { key: "spring", d: new Date(y, 2, 20) },
        { key: "summer", d: new Date(y, 5, 21) },
        { key: "autumn", d: new Date(y, 8, 22) },
        { key: "winter", d: new Date(y, 11, 21) },
      ];
    }

    const SEASONS = {
      spring: { name: "Spring", emoji: "🌸", a: "#7ee8a4", b: "#f279a6" },
      summer: { name: "Summer", emoji: "☀️", a: "#ffd166", b: "#ff7b54" },
      autumn: { name: "Autumn", emoji: "🍂", a: "#f4a259", b: "#d4571f" },
      winter: { name: "Winter", emoji: "❄️", a: "#a9d6e5", b: "#5f8fd8" },
    };

    const OPPOSITE = { spring: "autumn", summer: "winter", autumn: "spring", winter: "summer" };

    function currentSeason(now) {
      const y = now.getFullYear();
      const starts = [...startsForYear(y - 1), ...startsForYear(y), ...startsForYear(y + 1)].sort(
        (a, b) => a.d - b.d
      );
      let idx = 0;
      for (let i = 0; i < starts.length; i++) {
        if (starts[i].d <= now) idx = i;
        else break;
      }
      return { start: starts[idx].d, end: starts[idx + 1].d, key: starts[idx].key };
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
    }

    function render() {
      const now = new Date();
      const { start, end, key } = currentSeason(now);
      const s = SEASONS[south ? OPPOSITE[key] : key];

      document.body.style.setProperty("--a", s.a);
      document.body.style.setProperty("--b", s.b);
      document.body.style.setProperty("--glow", `rgba(${hexToRgb(s.b)}, 0.55)`);
      document.getElementById("emoji").textContent = s.emoji;
      document.getElementById("name").textContent = s.name;

      const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const daysLeft = Math.max(0, Math.round((end - startToday) / 86400000));
      const pct = Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));

      document.getElementById("fill").style.width = pct + "%";
      document.getElementById("pct").textContent = pct.toFixed(1) + "%";
      document.getElementById("days").textContent =
        daysLeft === 0 ? "ends today" : daysLeft + "d left";
    }

    render();

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
