<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Year Progress — Numbered</title>
<style>
  :root {
    --black: #000000;
    --gray-past: #ffffff;
    --gray-future: #333333;
    --red: #ff3b30;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--black);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    padding: 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex: 0 0 auto;
    margin-bottom: 10px;
  }

  .label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #777777;
    font-weight: 600;
  }

  .percent {
    font-size: 13px;
    color: #777777;
    font-variant-numeric: tabular-nums;
  }

  .grid-outer {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .grid {
    display: grid;
    gap: 6px 4px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 3px;
  }

  .dot {
    border-radius: 50%;
    background: var(--gray-future);
    transition: background 0.3s ease;
    flex: 0 0 auto;
  }

  .dot.past {
    background: var(--gray-past);
  }

  .dot.today {
    background: var(--red);
    box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.25);
  }

  .day-num {
    color: #555555;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  .cell.today .day-num {
    color: var(--red);
  }
</style>
</head>
<body>
  <div class="header">
    <span class="label" id="year-label"></span>
    <span class="percent" id="percent-label"></span>
  </div>
  <div class="grid-outer" id="grid-outer">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const gridEl = document.getElementById("grid");
    const gridOuterEl = document.getElementById("grid-outer");
    const yearLabelEl = document.getElementById("year-label");
    const percentLabelEl = document.getElementById("percent-label");
    const COL_GAP = 4;
    const ROW_GAP = 6;
    const LABEL_GAP = 3;

    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    }

    function dayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 1);
      return Math.floor((date - start) / 86400000) + 1;
    }

    let currentTotalDays = 0;

    function fitGrid() {
      if (!currentTotalDays) return;
      const w = gridOuterEl.clientWidth;
      const h = gridOuterEl.clientHeight;
      if (!w || !h) return;

      // Each cell = dot (square, side S) + label gap + label row (height ~0.6*S).
      let best = { cols: 1, rows: currentTotalDays, size: 0 };
      for (let cols = 1; cols <= currentTotalDays; cols++) {
        const rows = Math.ceil(currentTotalDays / cols);
        const sizeByWidth = (w - COL_GAP * (cols - 1)) / cols;
        const cellHeight = (h - ROW_GAP * (rows - 1)) / rows;
        const sizeByHeight = cellHeight / 1.75;
        const size = Math.min(sizeByWidth, sizeByHeight);
        if (size > best.size) best = { cols, rows, size };
      }

      gridEl.style.gridTemplateColumns = `repeat(${best.cols}, ${best.size}px)`;
      gridEl.style.gridAutoRows = `${best.size * 1.75}px`;
      document.querySelectorAll(".dot").forEach((dot) => {
        dot.style.width = `${best.size}px`;
        dot.style.height = `${best.size}px`;
      });
      document.querySelectorAll(".day-num").forEach((el) => {
        el.style.fontSize = `${Math.max(6, best.size * 0.5)}px`;
      });
    }

    function render() {
      const now = new Date();
      const year = now.getFullYear();
      const totalDays = isLeapYear(year) ? 366 : 365;
      const today = dayOfYear(now);
      currentTotalDays = totalDays;

      yearLabelEl.textContent = year;
      percentLabelEl.textContent = Math.round((today / totalDays) * 100) + "%";

      gridEl.innerHTML = "";
      const frag = document.createDocumentFragment();
      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        const dot = document.createElement("div");
        dot.className = "dot";
        if (d < today) dot.classList.add("past");
        else if (d === today) {
          dot.classList.add("today");
          cell.classList.add("today");
        }

        const numEl = document.createElement("div");
        numEl.className = "day-num";
        numEl.textContent = d;

        cell.appendChild(dot);
        cell.appendChild(numEl);
        frag.appendChild(cell);
      }
      gridEl.appendChild(frag);
      fitGrid();
    }

    render();

    new ResizeObserver(() => fitGrid()).observe(gridOuterEl);

    function msUntilNextMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      return next - now;
    }

    function scheduleNextRender() {
      setTimeout(() => {
        render();
        scheduleNextRender();
      }, msUntilNextMidnight());
    }

    scheduleNextRender();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") render();
    });
  </script>
</body>
</html>
